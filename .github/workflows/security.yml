name: Security & Quality CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  security-audit-and-build:
    name: Security Audit, Integrity & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Type Check
        run: npm run lint

      - name: Production Application Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Exam Generator Integrity Audit
        run: npm run validate:exams

      - name: Production Dependency Security Audit
        run: npm run security:audit
