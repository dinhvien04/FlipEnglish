name: Security & Quality CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  security-audit-and-build:
    name: Security Audit, Integrity & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7 # v4.2.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies (Strict clean install)
        run: npm ci

      - name: Code Quality & Type Check
        run: npm run lint

      - name: Production Application Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Exam Generator Integrity Audit
        run: npm run validate:exams

      - name: Curriculum Integrity & Visual Audit
        run: npm run validate:curriculum

      - name: Production Dependency Security Audit
        run: npm run security:audit

      - name: Production Security Smoke Tests
        run: npm run test:security
